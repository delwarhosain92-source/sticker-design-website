<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DT WEB DESIGN Admin</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
.box{max-width:500px;margin:40px auto;background:white;padding:22px;border-radius:12px}
input,textarea,button{width:100%;padding:13px;margin:9px 0;box-sizing:border-box}
button{background:#2563eb;color:white;border:0;border-radius:6px}
h2{color:#2563eb}
</style>
</head>
<body>
<div class="box">
<h2>DT WEB DESIGN Admin</h2>

<div id="login">
<h3>অ্যাডমিন লগইন</h3>
<input id="email" type="email" placeholder="ইমেইল">
<input id="password" type="password" placeholder="পাসওয়ার্ড">
<button onclick="login()">লগইন</button>
</div>

<div id="panel" hidden>
<h3>ওয়েবসাইটের তথ্য পরিবর্তন</h3>
<label>ওয়েবসাইটের নাম</label>
<input id="site">
<label>সার্ভিসের বিবরণ</label>
<textarea id="details"></textarea>
<label>যোগাযোগ নম্বর</label>
<input id="phone">
<button onclick="saveData()">তথ্য সংরক্ষণ করুন</button>
<button onclick="logout()">লগআউট</button>
</div>
<p id="msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = supabase.createClient(
'https://xobajhqqgtbiybaaswbf.supabase.co',
'sb_publishable_5u2_C7OL5ZiPo1ObWQuWkQ_sX_E2fHS'
);

async function login(){
const {error}=await db.auth.signInWithPassword({
email:document.getElementById('email').value,
password:document.getElementById('password').value
});
if(error){msg(error.message);return;}
document.getElementById('login').hidden=true;
document.getElementById('panel').hidden=false;
await loadData();
}

async function loadData(){
const {data,error}=await db.from('website_settings')
.select('*').eq('id',1).single();
if(error){msg(error.message);return;}
site.value=data.site_name||'';
details.value=data.service_details||'';
phone.value=data.contact_phone||'';
}

async function saveData(){
const {error}=await db.from('website_settings')
.update({
site_name:site.value,
service_details:details.value,
contact_phone:phone.value,
updated_at:new Date().toISOString()
}).eq('id',1);
msg(error?error.message:'তথ্য সফলভাবে সংরক্ষিত হয়েছে!');
}

async function logout(){
await db.auth.signOut();
document.getElementById('panel').hidden=true;
document.getElementById('login').hidden=false;
}

const msg = text => document.getElementById('msg').innerText=text;
</script>
</body>
</html>
