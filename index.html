<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function () {
  const db = window.supabase.createClient(
    'https://xobajhqqgtbiybaaswbf.supabase.co',
    'sb_publishable_5u2_C7OL5ZiPo1ObWQuWkQ_sX_E2fHS'
  );

  const { data, error } = await db
    .from('site_settings')
    .select('site_name, service_details, contact_phone')
    .eq('setting_name', 'main')
    .maybeSingle();

  if (error || !data) {
    console.log('Settings load error:', error);
    return;
  }

  if (data.site_name) {
    document.title = data.site_name;
    const brand = document.querySelector('.brand');
    if (brand) brand.textContent = data.site_name;
  }

  if (data.service_details) {
    const description = document.querySelector('.hero-grid > div:first-child > p');
    if (description) description.textContent = data.service_details;
  }

  if (data.contact_phone) {
    const phone = data.contact_phone;
    const phoneLink = document.querySelector('.contact-details a[href^="tel:"]');
    if (phoneLink) {
      phoneLink.textContent = phone;
      phoneLink.href = 'tel:' + phone.replace(/[^+0-9]/g, '');
    }
  }
})();
</script>
